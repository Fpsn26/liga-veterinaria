<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon.png">
    <title>Recuperar senha | LAHVET</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/password-reset.js" defer></script>
  </head>
  <body>
    <main>
      <a class="back-link" href="/pages/login.html">Voltar ao login</a>
      <h1>Recuperar senha</h1>
      <p>Informe sua matrícula ou email institucional. O link será enviado ao email cadastrado pela direção e valerá por 30 minutos.</p>
      <form id="password-reset-form" class="entry-form entry-form--login" data-action="request">
        <p class="form-field"><label for="identifier">Email institucional ou matrícula</label>
          <input id="identifier" name="identifier" autocomplete="username" required maxlength="254"></p>
        <div class="form-actions"><button type="submit">Enviar link</button></div>
      </form>
      <p id="reset-message" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
